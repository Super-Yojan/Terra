[package]
name = "terra-av"
version.workspace = true
edition.workspace = true
description = "Modular autonomy pipeline: sensors, state estimation, perception and mapping, planning, execution."

[lib]
# lib: Rust users and tests. staticlib: linked into the iOS app.
# cdylib: read by the binding generator.
crate-type = ["lib", "staticlib", "cdylib"]

[lints.rust]
unused_variables = "allow"
dead_code = "allow"

[dependencies]
uniffi = "=0.31.1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
# Base-station link. Same version as the dashboard scripts. TCP and TLS only
# (the fleet router is tls/...:7448), with router login.
zenoh = { version = "=1.10.1", default-features = false, features = ["auth_usrpwd", "transport_tcp", "transport_tls"], optional = true }

[features]
default = ["zenoh"]
bindgen = ["uniffi/cli"]
# Build without it (--no-default-features) for a smaller binary with no
# network link; `[comms] type = "zenoh"` is then a config error.
zenoh = ["dep:zenoh"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]
