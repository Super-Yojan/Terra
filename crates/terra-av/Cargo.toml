[package]
name = "terra-av"
version.workspace = true
edition.workspace = true
description = "Modular autonomy pipeline: sensors, state estimation, perception and mapping, planning, execution."

[lib]
# lib: Rust users and tests. staticlib: linked into the iOS app.
# cdylib: read by the binding generator.
crate-type = ["lib", "staticlib", "cdylib"]

[lints.rust]
unused_variables = "allow"
dead_code = "allow"

[dependencies]
uniffi = "=0.31.1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# The current task, kept on disk across restarts (tasks.rs).
serde_json = "1"
# Base-station link: the wire contract shared with the base station.
terra-comms = { path = "../terra-comms", default-features = false }
# WebRTC FPV signaling state machine (no media, no Zenoh).
fpv-signaling = { path = "../fpv-signaling" }

[dev-dependencies]
# Only to start a local router in tests/comms.rs. Same version as terra-comms.
zenoh = { version = "=1.10.1", default-features = false, features = ["auth_usrpwd", "transport_tcp", "transport_tls"] }

[features]
default = ["zenoh"]
bindgen = ["uniffi/cli"]
# The Zenoh link to the base station. Build without it
# (--no-default-features) for a smaller binary with no network link; a
# `[comms]` table is then a config error.
zenoh = ["terra-comms/zenoh"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]
