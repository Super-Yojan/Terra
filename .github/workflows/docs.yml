name: Docs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: terra-docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The Astro site in docs/, published at super-yojan.dev/Terra/,
  # with the Rust API docs at /Terra/api/.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        working-directory: docs
        run: npm ci

      - name: Site
        working-directory: docs
        run: npm run build

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential cmake

      - name: Workspace API docs
        run: cargo doc --no-deps --locked --workspace

      - name: Publish API docs at /api/
        run: |
          mkdir -p docs/dist/api
          cp -a target/doc/. docs/dist/api/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
