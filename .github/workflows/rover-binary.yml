name: Raspberry Pi executable

on:
  push:
    tags: ["rover-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compile and check ARM64 release
        run: |
          docker buildx build --platform linux/arm64 \
            -f apps/rover-pi/packaging/rover/Dockerfile \
            --output type=local,dest=apps/rover-pi/dist .
      - name: Save installable release
        uses: actions/upload-artifact@v4
        with:
          name: terra-rover-linux-arm64
          path: |
            apps/rover-pi/dist/*.tar.gz
            apps/rover-pi/dist/*.sha256
          if-no-files-found: error
