name: Dev container

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: devcontainer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # A parallel Bevy link can exceed the 16 GB GitHub-hosted runner.
      - name: Add swap
        run: |
          swap_file="$(sudo mktemp /terra-ci-swap.XXXXXX)"
          sudo fallocate -l 16G "$swap_file"
          sudo chmod 600 "$swap_file"
          sudo mkswap "$swap_file"
          sudo swapon "$swap_file"

      - name: Build the dev container and test the simulator
        uses: devcontainers/ci@v0.3
        with:
          push: never
          env: |
            CARGO_BUILD_JOBS=2
          runCmd: |
            set -euo pipefail
            test -f /etc/vulkan/terra-lvp.json
            env -u DISPLAY vulkaninfo --summary
            rustc --version
            cargo build --locked --manifest-path simulator/Cargo.toml
            cargo test --locked --manifest-path simulator/Cargo.toml
            python3 -m unittest discover -s simulator/tools -p 'test_*.py'
