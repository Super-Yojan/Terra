# terra-av pipeline for Terra. One implementation per stage; see
# crates/terra-av/src/config.rs.

# The app's setup screen replaces this table with the rover it describes.
# length × width: exact rectangular footprint (m) used by the planners.
[vehicle]
type = "diff_drive"
track = 0.5
max_wheel_speed = 0.8
length = 0.6
width = 0.45

# Phone landscape on the rover, screen facing the rover, rear camera out,
# camera 0.23 m above the ground. Roll sign untested.
[mount]
roll = -90
pitch = 0
yaw = 0
offset = [0.0, 0.0, 0.23]

[estimator]
type = "localization"

[mapper]
type = "occupancy_grid"
resolution = 0.1

# The planner and controller for a pose goal from the phone, and the
# defaults offered to the base station. A task from the base station names
# its own controller (teleop, drive_pose, dwa, remote) and, optionally,
# planner (straight_line, hybrid_astar); see planning/registry.rs.
[path_planner]
type = "straight_line"

[local_planner]
type = "teleop"

# The velocity loop (twist → wheel effort) runs in the app:
# Motors/VelocityController.swift.

# Base station link (terra-comms): keys terra/<rover_id>/<topic> via the
# fleet router; see crates/terra-comms/API.md. The password is not here
# (this file ships inside the app, and a password key is an error): set it
# in the app with "Router password"; it is kept in the Keychain. Remove this
# section to send nothing.
[comms]
rover_id = 0
# endpoint = "tcp/192.168.8.100:7447"
endpoint = "tcp/192.168.1.150:7447"
