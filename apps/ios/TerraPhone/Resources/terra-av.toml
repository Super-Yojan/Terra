# terra-av pipeline for Terra. One implementation per stage; see
# crates/terra-av/src/config.rs.

[vehicle]
type = "diff_drive"
track = 0.5
max_wheel_speed = 0.8

# Phone landscape on the rover, screen facing the rover, rear camera out,
# camera 0.23 m above the ground. Roll sign untested.
[mount]
roll = -90
pitch = 0
yaw = 0
offset = [0.0, 0.0, 0.23]

[estimator]
type = "vio"

[mapper]
type = "occupancy_grid"
resolution = 0.1

[path_planner]
type = "straight_line"

[local_planner]
type = "teleop"

# The velocity loop (twist → wheel effort) runs in the app:
# Motors/VelocityController.swift.

# Base station link: depth on terra/<rover_id>/depth via the fleet router.
# The password is not here (this file ships inside the app): set it in the
# app with "Router password"; it is kept in the Keychain. Remove this
# section to send nothing.
[comms]
type = "zenoh"
rover_id = "0"
endpoint = "tls/argos.34.135.204.210.sslip.io:7448"
user = "terra"
