="#15803d" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="normal" font-style="normal">C  Camera:       at lens, offset d_BC = [0.25, 0, 0.23] m</text><text x="762" y="185" fill="#111827" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="bold" font-style="normal">Transform Chain (Vio::update)</text><text x="762" y="208" fill="#111827" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="normal" font-style="italic">R_W←B  =  R_W←A · R_A←C · (R_B←C)ᵀ</text><text x="762" y="230" fill="#c2410c" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="normal" font-style="italic">p_B^W  =  R_W←A · p_C^A  −  R_W←B · d_BC</text><line x1="40.0" y1="565.0" x2="1080.0" y2="565.0" stroke="#e5e7eb" stroke-width="1.0"/><text x="44" y="590" fill="#111827" font-family="Georgia, 'Times New Roman', serif" font-size="14.5">Fig. 1.  Terra VIO System Coordinate Definition.  All four frames shown in a single 3D view: ARKit World A (Y-up, purple),</text><text x="44" y="611" fill="#111827" font-family="Georgia, 'Times New Roman', serif" font-size="14.5">Terra World W (Z-up, blue, related by R_W←A: (x,y,z)_A → (−z,−x,y)_W), Rover Body B (FLU, crimson, translated by p_B^W and</text><text x="44" y="632" fill="#111827" font-family="Georgia, 'Times New Roman', serif" font-size="14.5">rotated by yaw ψ CCW about +Z_W), and Camera C (green, mounted at offset d_BC = [0.25, 0, 0.23]ᵀ m with lens −Z_C along +X_B).</text><text x="44" y="653" fill="#111827" font-family="Georgia, 'Times New Roman', serif" font-size="14.5">The dashed triangle shows why Vio::update recovers the body origin via  p_B^W = R_W←A · p_C^A − R_W←B · d_BC.</text>
</svg>
