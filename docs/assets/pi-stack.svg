<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" role="img">
<title>Phone to Pi to motors</title>
<rect width="720" height="220" rx="16" fill="#f4f6f8"/>
<text x="24" y="32" font-family="ui-sans-serif,sans-serif" font-size="16" font-weight="700" fill="#263238">Physical link · Bluetooth only</text>
<g transform="translate(30,58)"><rect width="150" height="72" rx="12" fill="#263238"/><text x="75" y="32" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="14" font-weight="700" fill="#fff">iPhone</text><text x="75" y="52" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#ffe082">TerraPhone</text></g><text x="168" y="100" font-family="ui-sans-serif,sans-serif" font-size="18" fill="#ffb300">→</text><g transform="translate(210,58)"><rect width="150" height="72" rx="12" fill="#263238"/><text x="75" y="32" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="14" font-weight="700" fill="#fff">Bluetooth</text><text x="75" y="52" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#ffe082">GATT 7e5a0010</text></g><text x="348" y="100" font-family="ui-sans-serif,sans-serif" font-size="18" fill="#ffb300">→</text><g transform="translate(390,58)"><rect width="150" height="72" rx="12" fill="#263238"/><text x="75" y="32" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="14" font-weight="700" fill="#fff">Pi</text><text x="75" y="52" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#ffe082">terra-rover</text></g><text x="528" y="100" font-family="ui-sans-serif,sans-serif" font-size="18" fill="#ffb300">→</text><g transform="translate(570,58)"><rect width="150" height="72" rx="12" fill="#263238"/><text x="75" y="32" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="14" font-weight="700" fill="#fff">Fusion HAT</text><text x="75" y="52" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#ffe082">M0–M3 / PWM</text></g><text x="708" y="100" font-family="ui-sans-serif,sans-serif" font-size="18" fill="#ffb300"></text>
<text x="24" y="176" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#546e7a">Gate file 0 = open. 1 = closed. Closing the gate does not arm.</text>
<text x="24" y="198" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#546e7a">Watchdog 200 ms. Zero effort coasts. It is not a brake.</text>
