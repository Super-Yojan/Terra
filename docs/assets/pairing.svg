<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" role="img">
<title>Customer pairing steps</title>
<rect width="720" height="200" rx="16" fill="#f4f6f8"/>
<text x="24" y="32" font-family="ui-sans-serif,sans-serif" font-size="16" font-weight="700" fill="#263238">Customer pairing · does not arm motors</text>
<g transform="translate(24,52)"><rect width="160" height="120" rx="12" fill="#fff" stroke="#cfd8dc"/><circle cx="24" cy="28" r="12" fill="#ffb300"/><text x="24" y="33" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="13" font-weight="700">1</text><text x="16" y="64" font-family="ui-sans-serif,sans-serif" font-size="13" font-weight="700" fill="#263238">Hold USR</text><text x="16" y="86" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#546e7a">3 seconds · LED slow</text></g>
<g transform="translate(199,52)"><rect width="160" height="120" rx="12" fill="#fff" stroke="#cfd8dc"/><circle cx="24" cy="28" r="12" fill="#ffb300"/><text x="24" y="33" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="13" font-weight="700">2</text><text x="16" y="64" font-family="ui-sans-serif,sans-serif" font-size="13" font-weight="700" fill="#263238">Find rovers</text><text x="16" y="86" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#546e7a">Name terra-XXXXXX</text></g>
<g transform="translate(374,52)"><rect width="160" height="120" rx="12" fill="#fff" stroke="#cfd8dc"/><circle cx="24" cy="28" r="12" fill="#ffb300"/><text x="24" y="33" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="13" font-weight="700">3</text><text x="16" y="64" font-family="ui-sans-serif,sans-serif" font-size="13" font-weight="700" fill="#263238">Accept pair</text><text x="16" y="86" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#546e7a">LED flashes ×3</text></g>
<g transform="translate(549,52)"><rect width="160" height="120" rx="12" fill="#fff" stroke="#cfd8dc"/><circle cx="24" cy="28" r="12" fill="#ffb300"/><text x="24" y="33" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="13" font-weight="700">4</text><text x="16" y="64" font-family="ui-sans-serif,sans-serif" font-size="13" font-weight="700" fill="#263238">Reconnect</text><text x="16" y="86" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#546e7a">Then configure</text></g></svg>