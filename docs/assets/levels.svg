<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="720" role="img">
<title>Four autonomy levels</title>
<rect width="720" height="180" rx="16" fill="#f4f6f8"/>
<text x="24" y="30" font-family="ui-sans-serif,sans-serif" font-size="16" font-weight="700" fill="#263238">Who is allowed to move</text>
<g transform="translate(20,48)"><rect width="165" height="110" rx="12" fill="#1565c0"/><text x="12" y="28" font-family="ui-sans-serif,sans-serif" font-size="13" font-weight="700" fill="#fff">teleop</text><text x="12" y="56" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#fff">You hold</text><text x="12" y="76" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#fff">the stick</text></g><g transform="translate(195,48)"><rect width="165" height="110" rx="12" fill="#00838f"/><text x="12" y="28" font-family="ui-sans-serif,sans-serif" font-size="13" font-weight="700" fill="#fff">assisted</text><text x="12" y="56" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#fff">Stick, plus</text><text x="12" y="76" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#fff">obstacle check</text></g><g transform="translate(370,48)"><rect width="165" height="110" rx="12" fill="#2e7d32"/><text x="12" y="28" font-family="ui-sans-serif,sans-serif" font-size="13" font-weight="700" fill="#fff">waypoint</text><text x="12" y="56" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#fff">You pick</text><text x="12" y="76" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#fff">one goal</text></g><g transform="translate(545,48)"><rect width="165" height="110" rx="12" fill="#ef6c00"/><text x="12" y="28" font-family="ui-sans-serif,sans-serif" font-size="13" font-weight="700" fill="#fff">supervised</text><text x="12" y="56" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#fff">Frontier</text><text x="12" y="76" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#fff">needs approval</text></g></svg>