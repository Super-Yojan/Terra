[package]
name = "simulator"
version = "0.1.0"
edition = "2024"

[dependencies]
terra-mapping = { path = "../crates/terra-mapping" }
terra-types = { path = "../crates/terra-types" }
terra-state = { path = "../crates/terra-state" }
terra-control = { path = "../crates/terra-control" }
terra-waypoint = { path = "../crates/terra-waypoint" }
bevy = {version="0.19.1", features=["bevy_scene", "bevy_gltf"]}
bevytiles = "0.1.0"
bevy_water = { path = "vendor/bevy_water", default-features = false, features = ["embed_shaders"] }
avian3d = { git = "https://github.com/avianphysics/avian", branch = "main" }
bevy_voxel_world = "=0.17.0"
bevy_procedural_tree = "=0.4.0"
fastrand = "2.3"
zenoh = { version = "1.10.1", default-features = false, features = ["transport_tcp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"



# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
terra-transport = { path = "../crates/terra-transport" }
