[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "terra-rover"
version = "0.2.0"
description = "Terra configurable Bluetooth actuator service"
requires-python = ">=3.10"
dependencies = ["bless==0.3.0", "bleak==1.1.1", "dbus-next==0.2.3", "dbus-fast==2.44.5; sys_platform == 'linux'", "typing-extensions==4.16.0"]

[tool.setuptools.packages.find]
include = ["terra_rover*"]

[dependency-groups]
dev = [
    "nuitka>=4.2.2",
    "pyinstaller>=6.22.3",
]

[tool.uv]
# Raspberry Pi deployment and macOS development; Bless 0.3's Windows pins conflict with Bleak.
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]
